name: One-time custom domain SEO repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Update old URLs and article headings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          old_hosts = (
              "https://etical-zenith-hackers.github.io/active",
              "http://etical-zenith-hackers.github.io/active",
              "https://etical-zenith-hackers.github.io",
              "http://etical-zenith-hackers.github.io",
          )
          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".xml", ".txt", ".js"}:
                  continue
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for old in old_hosts:
                  text = text.replace(old, "https://ethicalzenithhackers.xyz")
              if path.parts and path.parts[0] == "articles":
                  text = re.sub(
                      r"<p>\\\\(#{2,3})\s*([^<]*)</p>",
                      lambda m: f"<h{len(m.group(1))}>{m.group(2).strip()}</h{len(m.group(1))}>",
                      text,
                  )
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))
          robots = Path("robots.txt")
          if robots.exists():
              text = robots.read_text(encoding="utf-8")
              text = re.sub(r"(?m)^Sitemap:.*$", "Sitemap: https://ethicalzenithhackers.xyz/sitemap.xml", text)
              robots.write_text(text, encoding="utf-8")
          print(f"Updated {len(changed)} files")
          print("\n".join(changed))
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix SEO URLs and article heading markup"
            git push origin main
          else
            echo "No changes to commit."
          fi
