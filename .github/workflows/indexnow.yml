name: Notify IndexNow of sitemap URLs

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'sitemap.xml'
      - 'sitemap-*.xml'
      - 'zenithindexnow20261021a84f2c7b91d0e6.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current sitemap
        uses: actions/checkout@v4

      - name: Wait for Pages deployment and submit the latest sitemap
        env:
          INDEXNOW_KEY: zenithindexnow20261021a84f2c7b91d0e6
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          host = "ethicalzenithhackers.xyz"
          key = os.environ["INDEXNOW_KEY"]
          sitemap_url = f"https://{host}/sitemap.xml"
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          def load_urls(read):
              """Read sitemap.xml, following a sitemap index to its child sitemaps."""
              found = []
              def walk(url, depth=0):
                  root = ET.fromstring(read(url))
                  if root.tag.endswith("}sitemapindex"):
                      if depth >= 3:
                          raise ValueError("Sitemap index is nested too deeply.")
                      for node in root.findall("sm:sitemap/sm:loc", ns):
                          child = (node.text or "").strip()
                          if child.startswith(f"https://{host}/"):
                              walk(child, depth + 1)
                  else:
                      for node in root.findall("sm:url/sm:loc", ns):
                          loc = (node.text or "").strip()
                          if loc.startswith(f"https://{host}/"):
                              found.append(loc)
              walk(sitemap_url)
              return list(dict.fromkeys(found))

          def read_repo(url):
              with open(url[len(f"https://{host}/"):], "rb") as f:
                  return f.read()

          def read_live(url):
              req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          expected = load_urls(read_repo)
          if not expected:
              raise SystemExit("Repository sitemap contains no URLs for the configured domain.")

          # GitHub Pages deployment can lag behind the push-triggered workflow.
          # Retry until the live sitemaps include every URL in the repository sitemaps.
          urls = []
          missing = set(expected)
          for attempt in range(1, 9):
              try:
                  urls = load_urls(read_live)
                  missing = set(expected) - set(urls)
                  print(f"Live sitemap check {attempt}: {len(urls)} URLs; repository has {len(expected)}.")
                  if not missing:
                      break
              except Exception as exc:
                  print(f"Live sitemap check {attempt} failed: {exc}")
              time.sleep(15)

          if missing:
              raise SystemExit(f"Live sitemap is stale or incomplete: {len(missing)} URLs missing.")
          if len(urls) > 10000:
              raise SystemExit("More than 10,000 URLs; IndexNow requires splitting into batches.")

          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls
          }).encode()
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow response: HTTP {response.status}; submitted {len(urls)} URLs.")
          except urllib.error.HTTPError as error:
              print(f"IndexNow response: HTTP {error.code}; {error.read().decode(errors='replace')}")
              if error.code not in (200, 202):
                  raise
          PY
