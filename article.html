<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenith Intelligence Article</title>
  <meta name="description" content="Cybersecurity, digital forensics, asset tracing and security intelligence from Zenith Hackers Intelligence.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://etical-zenith-hackers.github.io/active/article.html">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Zenith Hackers Intelligence">
  <meta name="twitter:card" content="summary">
  <style>
    :root{--bg:#05080d;--panel:#0b111a;--text:#eaf2f8;--muted:#9aabb9;--line:#1b2a38;--accent:#49d9ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.7}
    a{color:var(--accent);text-decoration:none}.wrap{width:min(860px,92%);margin:auto}
    nav{border-bottom:1px solid var(--line);padding:18px 0}.brand{font-weight:900;letter-spacing:.04em}.brand span{color:var(--accent)}
    main{padding:70px 0}.tag{display:inline-block;border:1px solid #284557;color:var(--accent);padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:800}
    h1{font-size:clamp(2.3rem,6vw,4.6rem);line-height:1.05;margin:18px 0}.meta{color:var(--muted);font-size:.9rem}.content{white-space:pre-wrap;color:#cbd6de;font-size:1.08rem;margin-top:35px}
    .error{padding:30px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
    footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted)}
  </style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="index.html">ZENITH <span>HACKERS</span></a></div></nav>
<main class="wrap"><article id="article"><div class="error">Loading article...</div></article></main>
<footer><div class="wrap">© <span id="year"></span> Zenith Hackers Intelligence · Ethical • Legal • Secure</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const {createClient}=window.supabase;
const sb=createClient(window.ZENITH_SUPABASE_URL,window.ZENITH_SUPABASE_PUBLISHABLE_KEY);
const esc=v=>(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const slug=new URLSearchParams(location.search).get('slug');
async function load(){
  if(!slug){document.title='Article | Zenith Hackers Intelligence';document.querySelector('#article').innerHTML='<div class="error">No article was specified.</div>';return;}
  const {data,error}=await sb.from('posts').select('title,slug,excerpt,content,author_name,category,cover_image,created_at').eq('published',true).eq('slug',slug).maybeSingle();
  if(error||!data){document.title='Article not found | Zenith Hackers Intelligence';document.querySelector('#article').innerHTML='<div class="error">Article not found.</div>';return;}
  document.title=data.title+' | Zenith Hackers Intelligence';
  document.querySelector('meta[name="description"]').setAttribute('content',data.excerpt||'Cybersecurity and security intelligence from Zenith Hackers Intelligence.');
  document.querySelector('link[rel="canonical"]').setAttribute('href',new URL('articles/'+encodeURIComponent(data.slug)+'.html',location.href).href);
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',data.title);
  document.querySelector('#article').innerHTML='<span class="tag">'+esc(data.category)+'</span><h1>'+esc(data.title)+'</h1><div class="meta">By '+esc(data.author_name)+' · '+new Date(data.created_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})+'</div>'+(data.cover_image?'<img src="'+esc(data.cover_image)+'" alt="" style="max-width:100%;margin:25px 0;border-radius:14px">':'')+'<div class="content">'+esc(data.content)+'</div>';
  const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BlogPosting','headline':data.title,'description':data.excerpt,'datePublished':data.created_at,'author':{'@type':'Person','name':data.author_name},'publisher':{'@type':'Organization','name':'Zenith Hackers Intelligence','url':'https://etical-zenith-hackers.github.io/active/'},'mainEntityOfPage':new URL('articles/'+encodeURIComponent(data.slug)+'.html',location.href).href});document.head.appendChild(ld);
}
document.querySelector('#year').textContent=new Date().getFullYear();load();
</script>
</body>
</html>
