<style>
:root{color-scheme:dark;--bg:#030b16;--panel:rgba(5,20,36,.91);--text:#f2f7fc;--muted:#a8bdce;--line:rgba(76,211,224,.27);--accent:#56dce8;--gold:#e7bd68}

body{margin:0;min-height:100vh;background:linear-gradient(180deg,rgba(2,9,18,.76),rgba(2,9,18,.9)),url("Zenithhackers%20covers/Cryptocurrency.png") center/cover fixed no-repeat,#030b16;color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.78}

<footer><div class="wrap"><strong>© <span id="year"></span> Zenith Hackers Intelligence</strong> · Professional · Ethical · Legal · Secure</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const {createClient}=window.supabase;
const sb=createClient(window.ZENITH_SUPABASE_URL,window.ZENITH_SUPABASE_PUBLISHABLE_KEY);
const esc=v=>(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const slug=new URLSearchParams(location.search).get('slug');
function renderArticleText(raw){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  let out='',paragraph=[],listType='';
  const flush=()=>{if(paragraph.length){out+='<p>'+esc(paragraph.join(' '))+'</p>';paragraph=[];}};
  const closeList=()=>{if(listType){out+='</'+listType+'>';listType='';}};
  for(const line of lines){
    const t=line.trim();
    if(!t){flush();closeList();continue;}
    const hm=t.match(/^(#{1,3})\s+(.+)$/);
    if(hm){flush();closeList();out+='<h'+(hm[1].length+1)+'>'+esc(hm[2])+'</h'+(hm[1].length+1)+'>';continue;}
    const bullet=t.match(/^[-*•]\s+(.+)$/);
    const numbered=t.match(/^\d+[.)]\s+(.+)$/);
    if(bullet||numbered){flush();const wanted=bullet?'ul':'ol';if(listType!==wanted){closeList();out+='<'+wanted+'>';listType=wanted;}out+='<li>'+esc((bullet||numbered)[1])+'</li>';continue;}
    closeList();paragraph.push(t);
  }
  flush();closeList();return out;
}
async function load(){
  if(!slug){document.title='Article | Zenith Hackers Intelligence';document.querySelector('#article').innerHTML='<div class="error">No article was specified.</div>';return;}
  const {data,error}=await sb.from('posts').select('title,slug,excerpt,content,author_name,category,cover_image,created_at').eq('published',true).eq('slug',slug).maybeSingle();
  if(error||!data){document.title='Article not found | Zenith Hackers Intelligence';document.querySelector('#article').innerHTML='<div class="error">Article not found.</div>';return;}
  document.title=data.title+' | Zenith Hackers Intelligence';
  document.querySelector('meta[name="description"]').setAttribute('content',data.excerpt||'Cybersecurity and security intelligence from Zenith Hackers Intelligence.');
  const canonicalUrl=new URL(location.pathname,'https://ethicalzenithhackers.xyz');canonicalUrl.searchParams.set('slug',data.slug);
  document.querySelector('link[rel="canonical"]').setAttribute('href',canonicalUrl.href);
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',data.title);
  document.querySelector('meta[property="og:description"]')?.setAttribute('content',data.excerpt||'Cybersecurity and security intelligence from Zenith Hackers Intelligence.');
  document.querySelector('meta[property="og:url"]')?.setAttribute('content',canonicalUrl.href);
  document.querySelector('meta[name="twitter:title"]')?.setAttribute('content',data.title);
  document.querySelector('meta[name="twitter:description"]')?.setAttribute('content',data.excerpt||'Cybersecurity and security intelligence from Zenith Hackers Intelligence.');
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',data.title);
  document.querySelector('#article').innerHTML='<span class="tag">'+esc(data.category)+'</span><h1>'+esc(data.title)+'</h1><div class="meta">By '+esc(data.author_name)+' · '+new Date(data.created_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})+'</div>'+(data.cover_image?'<img src="'+esc(data.cover_image)+'" alt="" style="max-width:100%;margin:25px 0;border-radius:14px">':'')+'<div class="content">'+renderArticleText(data.content)+'</div><aside class="recommendation"><strong>Need a professional, authorized review?</strong><p>Zenith Hackers Intelligence can discuss evidence-led cybersecurity and digital investigation options within a clearly agreed lawful scope. For information, email <a href="mailto:support@zenithhackers.com">support@zenithhackers.com</a>. Never share passwords, private keys or recovery phrases. No recovery outcome is guaranteed.</p></aside>';
  const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BlogPosting','headline':data.title,'description':data.excerpt,'datePublished':data.created_at,'author':{'@type':'Person','name':data.author_name},'publisher':{'@type':'Organization','name':'Zenith Hackers Intelligence','url':'https://ethicalzenithhackers.xyz/'},'mainEntityOfPage':canonicalUrl.href});document.head.appendChild(ld);
}
document.querySelector('#year').textContent=new Date().getFullYear();load();
</script>
